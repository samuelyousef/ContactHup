<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <nav class="navbar">
    <div class="container-fluid">
      <div class="navbar-brand">
        <div class="logo">
          <div class="logo-icon">
            <i class="fas fa-address-book"></i>
          </div>
          <div class="logo-text">
            <span class="logo-main">Contact<span class="logo-hub">Hub</span></span>
            <span class="logo-tagline">Smart Contact Manager</span>
          </div>
        </div>
      </div>
      <div class="navbar-actions">
        <button class="btn btn-primary" id="AddContact" data-bs-toggle="modal" data-bs-target="#addContactModal">
          <i class="fas fa-plus"></i> Add Contact
        </button>
        <div class="nav-icons">
          <i class="fas fa-bell"></i>
          <i class="fas fa-cog"></i>
          <div class="profile-pic">
            <img src="./images/avatar-3.jpg" alt="Profile" />
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- three grid column -->
  <div class="container dashboard-cards">
    <div class="row g-3">
      <div class="col-md-4">
        <div class="stat-card stat-total">
          <div class="stat-icon">
            <i class="fas fa-users"></i>
          </div>
          <div class="stat-info">
            <div class="stat-label">TOTAL</div>
            <div class="stat-value" id="totalContacts">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card stat-favorites">
          <div class="stat-icon">
            <i class="fas fa-star"></i>
          </div>
          <div class="stat-info">
            <div class="stat-label">FAVORITES</div>
            <div class="stat-value" id="favoritesCount">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card stat-emergency">
          <div class="stat-icon">
            <i class="fas fa-heartbeat"></i>
          </div>
          <div class="stat-info">
            <div class="stat-label">EMERGENCY</div>
            <div class="stat-value" id="emergencyCount">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- All content -->
  <div class="container main-content">
    <div class="row">
      <div class="col-lg-8">
        <div class="contacts-section p-0">
          <div class="section-header">
            <h2>All Contacts</h2>
            <p class="section-subtitle">
              Manage and organize your
              <span id="contactsCount">2</span> contacts
            </p>
          </div>

          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search contacts..." id="searchInput" oninput="search()" />
          </div>

          <div class="contacts-list" id="contactsList">

            <div class="container">
              <div class="row g-4" id="rowData">

                <!-- <p class="alert alert-danger text-center">No contacts found</p> -->
                


              </div>
            </div>


          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-header">
              <i class="fas fa-star"></i>
              <h3>Favorites</h3>
            </div>
            <p class="sidebar-subtitle">Quick access to starred contacts</p>
            <div class="favorites-list" id="favoritesList">


              <!-- <div class="sidebar-contact-card">
                  <div class="sidebar-contact-avatar" style="background: #3b82f6">
                    SG
                  </div>
                  <div class="sidebar-contact-info">
                    <h5>Stephanie Gaines</h5>
                    <p>01050079305</p>
                  </div>
                  <button class="sidebar-call-btn favorites-call">
                    <i class="fas fa-phone"></i>
                  </button>
                </div> -->


            </div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-header">
              <i class="fas fa-heartbeat"></i>
              <h3>Emergency</h3>
            </div>
            <p class="sidebar-subtitle">
              Important contacts for urgent calls
            </p>
            <div class="emergency-list" id="emergencyList">





            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Contact Form -->
  <div class="modal fade " id="addContactModal" tabindex="-1" aria-labelledby="AddContact" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="AddContact">
            Add New Contact
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="contactForm">
            <div class="contact-photo-section">
              <div class="contact-photo-preview">
                <i class="fas fa-user"></i>
              </div>
              <label for="photoInput" class="btn btn-secondary btn-sm" id="changePhotoBtn">
                <i class="fas fa-camera"></i> Change Photo
                </م>
                <input type="file" id="photoInput" accept="image/*" style="display: none" />
            </div>

            <div class="form-group">
              <label for="contactName">Full Name <span class="required">*</span></label>
              <input type="text" class="form-control" id="contactName" placeholder="Enter full name" required />
            </div>

            <div class="form-group">
              <label for="contactPhone">Phone Number <span class="required">*</span></label>
              <input type="tel" class="form-control" id="contactPhone" placeholder="e.g., 01012345678" required />
            </div>

            <div class="form-group">
              <label for="contactEmail">Email Address</label>
              <input type="email" class="form-control" id="contactEmail" placeholder="name@example.com" />
            </div>

            <div class="form-group">
              <label for="contactAddress">Address</label>
              <input type="text" class="form-control" id="contactAddress" placeholder="Enter address" />
            </div>

            <div class="form-group">
              <label for="contactGroup">Group</label>
              <select class="form-control" id="contactGroup">
                <option value="">Select a group</option>
                <option value="family">Family</option>
                <option value="friends">Friends</option>
                <option value="work">Work</option>
                <option value="school">School</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="contactNotes">Notes</label>
              <textarea class="form-control" id="contactNotes" rows="3"
                placeholder="Add notes about this contact"></textarea>
            </div>

            <div class="form-checkboxes">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="contactFavorite" />
                <label class="form-check-label" for="contactFavorite">
                  <i class="fas fa-star"></i> Favorite
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="contactEmergency" />
                <label class="form-check-label" for="contactEmergency">
                  <i class="fas fa-heartbeat"></i> Emergency
                </label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button onclick="AddContact();ClearAllData();" type="button" data-bs-dismiss="modal" aria-label="Close" class="btn btn-primary" id="saveContactBtn">
            <i class="fas fa-check"></i> Save Contact
          </button>
          <button onclick="updateItem()" type="button" class="btn btn-warning d-none" id="updateContactBtn">
            <i class="fas fa-check"></i> update Contact
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/index.js"></script>
  <script src="./js/bootstrap.bundle.min.js"></script>

</body>

</html>
